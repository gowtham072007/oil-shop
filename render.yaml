services:
  - type: web
    name: mani-oils
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mani-oils-db
          property: connectionString
      - key: ADMIN_PIN
        value: "1234"
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: mani-oils-db
    plan: free
    databaseName: manioils
    user: mani_user
